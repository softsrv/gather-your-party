name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      # internal/testdb starts a throwaway Postgres container per package using the
      # runner's Docker; pre-pulling keeps the image download out of test timeouts.
      - name: Pull Postgres image
        run: docker pull postgres:16-alpine

      - name: Integration tests
        run: go test -tags=integration ./... -count=1

      - name: Check test containers were removed
        if: always()
        run: test -z "$(docker ps -aq --filter label=gather-your-party-test=1)"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2.13.0+ is required to analyze Go 1.27 code.
          version: v2.14.0
          args: --build-tags=integration
