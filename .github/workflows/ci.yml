name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      # internal/testdb starts a throwaway Postgres container per package using the
      # runner's Docker; pre-pulling keeps the image download out of test timeouts.
      - name: Pull Postgres image
        run: docker pull postgres:16-alpine

      - name: Integration tests
        run: go test -tags=integration ./... -count=1

      - name: Check test containers were removed
        if: always()
        run: test -z "$(docker ps -aq --filter label=gather-your-party-test=1)"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2.13.0+ is required to analyze Go 1.27 code.
          version: v2.14.0
          args: --build-tags=integration

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute image tag
        id: vars
        shell: bash
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gather-your-party:${{ steps.vars.outputs.sha }}
            ${{ secrets.DOCKER_USERNAME }}/gather-your-party:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_ACCOUNT_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Render Cloud Run service
        run: |
          sed "s|__IMAGE__|${{ secrets.DOCKER_USERNAME }}/gather-your-party:${{ steps.vars.outputs.sha }}|g" service.yaml > service.rendered.yaml

      - name: Deploy to Cloud Run
        run: gcloud run services replace service.rendered.yaml --region us-central1
