name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute image tag
        id: vars
        shell: bash
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gather-your-party:${{ steps.vars.outputs.sha }}
            ${{ secrets.DOCKER_USERNAME }}/gather-your-party:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_ACCOUNT_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Render Cloud Run service
        run: |
          sed "s|__IMAGE__|${{ secrets.DOCKER_USERNAME }}/gather-your-party:${{ steps.vars.outputs.sha }}|g" service.yaml > service.rendered.yaml

      - name: Deploy to Cloud Run
        run: gcloud run services replace service.rendered.yaml --region us-central1
